<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resolute Workbench</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/spatial-player.css" />
    <style>
      html, body, body[data-theme="dark"] { background: transparent; }
      body { position: relative; --orb-size: min(60vw, 60vh); }
      #babylon-stage { position: absolute; inset: 0; }
      #babylon-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      #sphere-shadow, #sphere-reflection { position: absolute; pointer-events: none; left: 50%; transform: translateX(-50%); border-radius: 50%; }
      #sphere-shadow { top: calc(50% + var(--orb-size) * .48); width: calc(var(--orb-size) * 1.1); height: calc(var(--orb-size) * .10); background: radial-gradient(ellipse, rgb(50 37 32 / .20), transparent 70%); filter: blur(8px); }
      #sphere-reflection { top: calc(50% + var(--orb-size) * .57); width: calc(var(--orb-size) * .85); height: calc(var(--orb-size) * .22); background: radial-gradient(ellipse at 50% 0%, rgb(248 238 230 / .17), transparent 70%); filter: blur(10px); }
    </style>
  </head>
  <body>
    <div id="babylon-stage">
      <canvas id="babylon-canvas" tabindex="0" aria-label="Resolute Spatial Workbench"></canvas>
      <div id="sphere-shadow" aria-hidden="true"></div>
      <div id="sphere-reflection" aria-hidden="true"></div>
    </div>
    <div id="bench-loading" role="status" aria-live="polite">
      <span class="loading-sphere" aria-hidden="true"></span>
      <p id="bench-loading-text">Starting the bench…</p>
    </div>
    <script type="module" src="/src/spatial/babylon-player.ts"></script>
  </body>
</html>

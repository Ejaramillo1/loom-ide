<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resolute Workbench</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/spatial-player.css" />
    <style>
      /* Babylon sphere stage: continuous atmospheric background, subtle
         diagonal light, and a soft shadow + reflection under the sphere.
         The canvas is transparent so this CSS shows through (v2 Stage 1.2). */
      body { position: relative; }
      #babylon-stage {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(120% 90% at 28% 12%, rgb(255 249 243 / 0.85), transparent 58%),
          linear-gradient(180deg, #f5f0eb, #efe6dd 55%, #e7dcd1);
      }
      body[data-theme="dark"] #babylon-stage {
        background:
          radial-gradient(120% 90% at 28% 12%, rgb(84 74 67 / 0.5), transparent 58%),
          linear-gradient(180deg, #1d1b1a, #24201e 55%, #1a1817);
      }
      #babylon-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      #sphere-shadow {
        position: absolute;
        left: 50%;
        top: 62%;
        width: 46%;
        height: 6%;
        transform: translate(-50%, -50%);
        background: radial-gradient(50% 50% at 50% 50%, rgb(65 48 38 / 0.18), transparent 70%);
        filter: blur(2px);
        pointer-events: none;
      }
      #sphere-reflection {
        position: absolute;
        left: 50%;
        top: 73%;
        width: 34%;
        height: 2%;
        transform: translate(-50%, -50%);
        background: linear-gradient(180deg, transparent, rgb(255 249 243 / 0.22));
        filter: blur(1px);
        pointer-events: none;
      }
      body[data-theme="dark"] #sphere-reflection {
        background: linear-gradient(180deg, transparent, rgb(240 233 226 / 0.12));
      }
    </style>
  </head>
  <body>
    <div id="babylon-stage">
      <canvas id="babylon-canvas" tabindex="0" aria-label="Resolute Spatial Workbench"></canvas>
      <div id="sphere-shadow" aria-hidden="true"></div>
      <div id="sphere-reflection" aria-hidden="true"></div>
    </div>
    <div id="bench-loading" role="status" aria-live="polite">
      <span class="loading-sphere" aria-hidden="true"></span>
      <p id="bench-loading-text">Starting the bench…</p>
    </div>
    <script type="module" src="/src/spatial/babylon-player.ts"></script>
  </body>
</html>

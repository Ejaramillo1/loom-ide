[package]
name = "living-workbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first human-centered knowledge workbench"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland", "accesskit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
debug = 0

[profile.release]
opt-level = 2
